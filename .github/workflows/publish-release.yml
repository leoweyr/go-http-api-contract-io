name: Publish Release

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  call-publish:
    uses: leoweyr/github-release-workflow/.github/workflows/reusable-publish-release.yml@v2.1.0
    with:
      main-branch: 'master'
      development-branch: 'develop'
      trb-repository: 'ODCLAB/odyssey-plan'
      trb-project-node-name: 'Go HTTP API Contract IO'
    secrets:
      ACCESS_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}
